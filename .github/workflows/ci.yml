name: CI

on:
 push:
 schedule:
   - cron: '0 1 * * *'

jobs:
  Windows:
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        config:
          - native_mixed
          - native_dyn
          - native_static
    runs-on: windows-2022
    env:
      OS_NAME: windows
      COMPILE_CONFIG: ${{matrix.config}}
      HOME: 'C:\\Users\\runneradmin'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install packages
      run: |
        choco.exe install pkgconfiglite ninja --allow-empty-checksums -y
    - name: Install python modules
      shell: bash
      run: |
        pip3 install meson pytest requests distro paramiko pillow
        pip3 install --no-deps $GITHUB_WORKSPACE
    - name: Install QT
      if: ${{ matrix.config == 'native_mixed' }}
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.4.3
        modules: "qtwebengine qtwebchannel qtpositioning"
        setup-python: false
      env:
        AQT_CONFIG: ${{ github.workspace }}/.github/configs/aqt.ini
    - name: Setup MSVC compiler
      uses: bus1/cabuild/action/msdevshell@v1
      with:
        architecture: x64
    - name: secret
      shell: bash
      run: |
        echo "${{secrets.ssh_key}}" > $SSH_KEY
      env:
        SSH_KEY: ${{ runner.temp }}/id_rsa
    - name: Ensure base deps
      run: |
        python .github\\scripts\\ensure_base_deps.py
      env:
        SSH_KEY: ${{ runner.temp }}/id_rsa
    - name: Compile all deps
      run: |
        python .github\\scripts\\compile_all_deps.py
      env:
        SSH_KEY: ${{ runner.temp }}/id_rsa
    - name: Build projects
      run: |
        python .github\\scripts\\build_projects.py
      env:
        SSH_KEY: ${{ runner.temp }}/id_rsa
    - name: Debug file locations
      if: ${{ matrix.config == 'native_mixed' }}
      shell: bash
      run: |
        echo "Looking for files in various locations:"
        echo "TEMP = $TEMP"
        echo "Contents of TEMP directory:"
        ls -la "$TEMP"/*kiwix* 2>/dev/null || echo "No kiwix files found in TEMP"
        echo "Contents of RUNNER~1 temp directory:"
        ls -la "C:/Users/RUNNER~1/AppData/Local/Temp/"*kiwix* 2>/dev/null || echo "No kiwix files found in RUNNER~1 temp"
        echo "Contents of runneradmin temp directory:"
        ls -la "C:/Users/runneradmin/AppData/Local/Temp/"*kiwix* 2>/dev/null || echo "No kiwix files found in runneradmin temp"
    - name: Upload MSIX artifact
      if: ${{ matrix.config == 'native_mixed' }}
      uses: actions/upload-artifact@v4
      with:
        name: kiwix-desktop-msix-${{ github.run_number }}
        path: |
          C:/Users/RUNNER~1/AppData/Local/Temp/kiwix-desktop_windows_x64_*.*
          C:/Users/runneradmin/AppData/Local/Temp/kiwix-desktop_windows_x64_*.*
        retention-days: 30
        if-no-files-found: warn
    - name: Sign MSIX package
      if: ${{ matrix.config == 'native_mixed' && env.SIGNING_CERTIFICATE != '' }}
      shell: powershell
      run: |
        Write-Host "Signing MSIX package..." -ForegroundColor Yellow

        # Create certificate file from base64
        $certBytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE)
        $certPath = "signing-cert.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)

        # Find SignTool
        $signToolPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
        if (-not (Test-Path $signToolPath)) {
          $WindowsKitsPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signToolPath = Get-ChildItem -Path $WindowsKitsPath -Recurse -Filter "signtool.exe" |
                         Where-Object { $_.Directory.Name -like "*x64*" } |
                         Sort-Object Name -Descending |
                         Select-Object -First 1 -ExpandProperty FullName
        }

        if (-not (Test-Path $signToolPath)) {
          Write-Error "SignTool not found. Please install Windows SDK."
          exit 1
        }

        # Find MSIX files
        $msixFiles = Get-ChildItem -Path "C:/Users/RUNNER~1/AppData/Local/Temp/" -Name "kiwix-desktop_windows_x64_*.msix"
        if ($msixFiles.Count -eq 0) {
          $msixFiles = Get-ChildItem -Path "C:/Users/runneradmin/AppData/Local/Temp/" -Name "kiwix-desktop_windows_x64_*.msix"
        }

        if ($msixFiles.Count -eq 0) {
          Write-Error "No MSIX package found to sign."
          exit 1
        }

        Write-Host "Using SignTool: $signToolPath" -ForegroundColor Cyan

        foreach ($msixFileName in $msixFiles) {
          # Determine full path
          $msixFile = $null
          $fullPath1 = "C:/Users/RUNNER~1/AppData/Local/Temp/$msixFileName"
          $fullPath2 = "C:/Users/runneradmin/AppData/Local/Temp/$msixFileName"

          if (Test-Path $fullPath1) {
            $msixFile = Get-Item $fullPath1
          } elseif (Test-Path $fullPath2) {
            $msixFile = Get-Item $fullPath2
          }

          if (-not $msixFile) {
            Write-Warning "Could not find MSIX file: $msixFileName"
            continue
          }

          Write-Host "Signing package: $($msixFile.Name)" -ForegroundColor Cyan

          # Sign the package with timestamp
          & $signToolPath sign /fd SHA256 /f $certPath /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 $msixFile.FullName

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to sign MSIX package: $($msixFile.Name) (exit code: $LASTEXITCODE)"
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "✅ MSIX package signed successfully: $($msixFile.Name)" -ForegroundColor Green

          # Verify the signature (don't fail on verification errors for self-signed certs)
          Write-Host "Verifying package signature..." -ForegroundColor Yellow
          & $signToolPath verify /pa /v $msixFile.FullName
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Package signature verified" -ForegroundColor Green
          } else {
            Write-Host "⚠️  Package signature verification failed (expected for self-signed certificates)" -ForegroundColor Yellow
            Write-Host "This is normal for development certificates and doesn't affect package functionality" -ForegroundColor Gray
          }
        }

        # Clean up certificate file
        Remove-Item $certPath -Force -ErrorAction SilentlyContinue

        # Reset exit code to success since verification failure is expected
        $global:LASTEXITCODE = 0
      env:
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    - name: Upload failure logs
      if: failure()
      run: |
        python .github\\scripts\\upload_failure_logs.py
      env:
        SSH_KEY: ${{ runner.temp }}/id_rsa

