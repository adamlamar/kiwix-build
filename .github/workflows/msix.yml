name: MSIX Package Builder

on:
  push:
    branches: [ main, msix, signing ]
  workflow_dispatch:
    inputs:
      nightly_url:
        description: 'URL to nightly build zip file'
        required: false
        default: 'https://download.kiwix.org/nightly/2025-12-11/kiwix-desktop_windows_x64_2025-12-11.zip'

env:
  # Default nightly build URL - change this to update the version
  NIGHTLY_URL: 'https://download.kiwix.org/nightly/2025-12-11/kiwix-desktop_windows_x64_2025-12-11.zip'

jobs:
  build-msix:
    name: Build and Sign MSIX Package
    environment: dev
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download nightly build
      shell: powershell
      run: |
        $url = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:NIGHTLY_URL_INPUT) {
          $env:NIGHTLY_URL_INPUT
        } else {
          $env:NIGHTLY_URL
        }

        & .\.github\scripts\download-nightly.ps1 -Url $url
      env:
        NIGHTLY_URL_INPUT: ${{ github.event.inputs.nightly_url }}

    - name: Create MSIX package
      shell: powershell
      run: |
        & .\.github\scripts\create-msix-simple.ps1

    - name: Validate signing certificate
      continue-on-error: true
      shell: powershell
      run: |
        & .\.github\scripts\validate-certificate.ps1
      env:
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Sign MSIX package
      continue-on-error: true
      id: sign-msix
      shell: powershell
      run: |
        # Let the script handle its own retry logic
        $exitCode = 0
        & .\.github\scripts\sign-msix.ps1
        $exitCode = $LASTEXITCODE

        if ($exitCode -eq 0) {
          Write-Host "[OK] Signing completed successfully" -ForegroundColor Green
        } else {
          Write-Host "[WARNING] Signing failed, will upload unsigned package" -ForegroundColor Yellow

          # Set fallback path to unsigned MSIX
          $unsignedPath = "$PWD\kiwix-desktop.msix"
          if (Test-Path $unsignedPath) {
            $timestamp = Get-Date -Format "yyyy-MM-dd-HHmm"
            $finalPath = "$PWD\kiwix-desktop-unsigned-$timestamp.msix"
            Move-Item $unsignedPath $finalPath -Force
            echo "SIGNED_MSIX_PATH=$finalPath" >> $env:GITHUB_ENV
            Write-Host "[OK] Unsigned package ready: $finalPath" -ForegroundColor Yellow
          }
        }
      env:
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Extract certificate for distribution
      continue-on-error: true
      shell: powershell
      run: |
        # Extract .cer file from the certificate for easy installation
        if ($env:SIGNING_CERTIFICATE) {
          Write-Host "Creating certificate file for distribution..." -ForegroundColor Cyan

          # Write PFX file temporarily
          $certBytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE)
          $pfxPath = "$PWD\temp-cert.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, $certBytes)

          # Extract the public certificate as .cer
          $cerPath = "$PWD\kiwix-development-certificate.cer"
          try {
            # Use PowerShell to extract the certificate
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGNING_PASSWORD)
            $cerBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            [System.IO.File]::WriteAllBytes($cerPath, $cerBytes)

            Write-Host "[OK] Certificate extracted: kiwix-development-certificate.cer" -ForegroundColor Green
            echo "CERTIFICATE_PATH=$cerPath" >> $env:GITHUB_ENV
          } catch {
            Write-Host "[WARNING] Could not extract certificate: $($_.Exception.Message)" -ForegroundColor Yellow
          } finally {
            # Clean up temporary PFX
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
          }
        }
      env:
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Upload MSIX package with certificate
      uses: actions/upload-artifact@v4
      with:
        name: kiwix-desktop-msix-${{ github.run_number }}
        path: |
          ${{ env.SIGNED_MSIX_PATH }}
          ${{ env.CERTIFICATE_PATH }}
        retention-days: 30
        compression-level: 0  # MSIX is already compressed
        if-no-files-found: warn

    - name: Package summary
      shell: powershell
      run: |
        if (Test-Path $env:SIGNED_MSIX_PATH) {
          $size = (Get-Item $env:SIGNED_MSIX_PATH).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          $packageName = Split-Path $env:SIGNED_MSIX_PATH -Leaf
          $isSigned = $packageName -notmatch "unsigned"

          Write-Host ""
          Write-Host "[SUMMARY] Package Summary:" -ForegroundColor Cyan
          Write-Host "=" * 40 -ForegroundColor Gray
          Write-Host "Package: $packageName" -ForegroundColor White
          Write-Host "Size: $sizeMB MB" -ForegroundColor White
          Write-Host "Nightly Source: $env:NIGHTLY_URL" -ForegroundColor White
          if ($isSigned) {
            Write-Host "Signed: YES" -ForegroundColor Green
          } else {
            Write-Host "Signed: NO (unsigned package)" -ForegroundColor Yellow
          }

          # Check if certificate was included
          if ($env:CERTIFICATE_PATH -and (Test-Path $env:CERTIFICATE_PATH)) {
            $certName = Split-Path $env:CERTIFICATE_PATH -Leaf
            Write-Host "Certificate: $certName (included)" -ForegroundColor Green
            Write-Host ""
            Write-Host "INSTALLATION INSTRUCTIONS:" -ForegroundColor Yellow
            Write-Host "1. Download and extract the artifact" -ForegroundColor Gray
            Write-Host "2. Right-click '$certName' -> Install Certificate" -ForegroundColor Gray
            Write-Host "3. Install to 'Local Machine' -> 'Trusted Root Certification Authorities'" -ForegroundColor Gray
            Write-Host "4. Double-click the .msix file to install Kiwix Desktop" -ForegroundColor Gray
          } else {
            Write-Host "Certificate: Not included" -ForegroundColor Yellow
          }

          Write-Host "Artifact: kiwix-desktop-msix-$env:GITHUB_RUN_NUMBER" -ForegroundColor White
          Write-Host "=" * 40 -ForegroundColor Gray
        } else {
          Write-Host "[WARNING] No MSIX package found for upload" -ForegroundColor Yellow
        }
